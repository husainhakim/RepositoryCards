<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; fill: #6b6f7d; letter-spacing: 1px; }
      .prompt { font-family: 'Consolas', 'Courier New', monospace; font-size: 25px; fill: #3ddc84; }
      .heading { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 42px; fill: #f2f3f5; }
      .comment { font-family: 'Consolas', 'Courier New', monospace; font-size: 25px; fill: #6b6f7d; }
      .field-key { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 25px; fill: #3ddc84; }
      .field-val { font-family: 'Consolas', 'Courier New', monospace; font-size: 25px; fill: #d7d9e0; }
      .hex { font-family: 'Consolas', 'Courier New', monospace; font-size: 22px; fill: #3a3d4a; }
      .tag { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; fill: #0d0e13; font-weight:700;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="10" fill="#0d0e13"/>
  <rect x="1" y="1" width="1198" height="458" rx="9" fill="none" stroke="#22242e" stroke-width="1.5"/>

  <text x="640" y="64" class="hex" text-anchor="middle">25 50 44 46 2D 31 2E 34 0A 89 50 4E 47 0D 0A 1A 0A 50 4B 03 04 14 00</text>
  <text x="640" y="440" class="hex" text-anchor="middle">7F 45 4C 46 02 01 01 00 00 00 4D 5A 90 00 03 00 00 00 04 00 00 00</text>

  <rect x="0" y="0" width="1200" height="42" rx="10" fill="#161822"/>
  <rect x="0" y="30" width="1200" height="12" fill="#161822"/>
  <circle cx="28" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="21" r="7" fill="#27c93f"/>
  <text x="600" y="27" text-anchor="middle" class="win-title">sec-ops — honeypot-ids — bash</text>

  <text x="48" y="100" class="prompt">$ $./honeynet --simulate</text>
  <text x="48" y="152" class="heading">Honeypot + IDS Lab</text>
  <text x="48" y="184" class="comment"># Dual-server honeypot, session-keyed IDS &amp; threshold detection lab</text>

  <line x1="48" y1="206" x2="1152" y2="206" stroke="#22242e" stroke-width="1.5"/>

  <text x="48" y="246" class="field-key">problem   →</text>
  <text x="220" y="246" class="field-val">Threshold alerts fail against rate-managed brute force &amp; evasion.</text>

  <text x="48" y="288" class="field-key">method    →</text>
  <text x="220" y="288" class="field-val">Tails session-tagged logs, triggers IDS on bursts, compares defenses.</text>

  <text x="48" y="330" class="field-key">stack     →</text>
  <text x="220" y="330" class="field-val">Node.js · Express · sql.js (WASM) · In-Memory Logs</text>

  <text x="48" y="372" class="field-key">status    →</text>
  <text x="220" y="372" class="field-val" fill="#3ddc84">Completed / Lab</text>
  <rect x="1080" y="355" width="20" height="20" fill="#3ddc84" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(0, 404)">
    <rect x="48" y="0" width="112" height="32" rx="5" fill="#3ddc84"/>
    <text x="104" y="21" text-anchor="middle" class="tag">HONEYPOT</text>
    <rect x="174" y="0" width="227.5" height="32" rx="5" fill="#f5a623"/>
    <text x="287.75" y="21" text-anchor="middle" class="tag">INTRUSION DETECTION</text>
    <rect x="415.5" y="0" width="206.5" height="32" rx="5" fill="#6ea8fe"/>
    <text x="518.75" y="21" text-anchor="middle" class="tag">THRESHOLD EVASION</text></g>
</svg>